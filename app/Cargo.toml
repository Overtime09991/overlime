[package]
name = "psplay"
version = "0.3.0"
edition = "2021"
description = "OVERLIME – eigener PS4/PS5 Remote Play Client"

[dependencies]
eframe = "0.29"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
base64 = "0.22"
cpal = "0.15"
sha2 = "0.10"
png = "0.17"
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
egui-phosphor = "0.7"
discord-rich-presence = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
